<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduCards - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "tertiary-container": "#007650",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#76ffc2",
                        "on-primary-fixed-variant": "#5a00c6",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-bright": "#353940",
                        "on-secondary-container": "#00424e",
                        "tertiary-fixed-dim": "#4edea3",
                        "surface-container": "#1c2026",
                        "tertiary": "#4edea3",
                        "on-tertiary-fixed-variant": "#005236",
                        "surface-container-high": "#262a31",
                        "secondary-container": "#03b5d3",
                        "on-background": "#dfe2eb",
                        "secondary": "#4cd7f6",
                        "background": "#10141a",
                        "secondary-fixed-dim": "#4cd7f6",
                        "surface": "#10141a",
                        "inverse-primary": "#732ee4",
                        "error-container": "#93000a",
                        "on-tertiary": "#003824",
                        "on-primary": "#3f008e",
                        "outline": "#958da1",
                        "inverse-surface": "#dfe2eb",
                        "on-primary-container": "#ede0ff",
                        "on-surface": "#dfe2eb",
                        "on-secondary-fixed-variant": "#004e5c",
                        "outline-variant": "#4a4455",
                        "surface-container-lowest": "#0a0e14",
                        "on-secondary": "#003640",
                        "primary-container": "#7c3aed",
                        "surface-container-highest": "#31353c",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#002113",
                        "primary-fixed-dim": "#d2bbff",
                        "surface-variant": "#31353c",
                        "primary": "#d2bbff",
                        "primary-fixed": "#eaddff",
                        "inverse-on-surface": "#2d3137",
                        "on-surface-variant": "#ccc3d8",
                        "surface-tint": "#d2bbff",
                        "on-secondary-fixed": "#001f26",
                        "surface-container-low": "#181c22",
                        "on-primary-fixed": "#25005a",
                        "surface-dim": "#10141a",
                        "secondary-fixed": "#acedff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "base": "8px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "max-width": "1280px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "display": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden relative">
<!-- Ambient Glow Background -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-primary-container/5 blur-[120px]"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-secondary-container/5 blur-[100px]"></div>
</div>
<!-- Login Container (Level 1 Glass) -->
<main class="relative z-10 w-full max-w-md bg-white/[0.03] backdrop-blur-[12px] border border-white/10 rounded-xl p-gutter md:p-10 shadow-2xl">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-display text-display text-primary mb-2 tracking-tight">EduCards</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your journey</p>
</div>
<!-- Role Toggle (Pill) -->
<div class="flex bg-surface-container-high rounded-full p-1 mb-8 border border-white/5">
<button class="flex-1 py-2 px-4 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md transition-all duration-200">
                Student
            </button>
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all duration-200">
                Teacher
            </button>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
</span>
<input class="w-full bg-surface-container-low border border-white/10 rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition-all placeholder:text-outline-variant" id="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
</span>
<input class="w-full bg-surface-container-low border border-white/10 rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-gradient-to-r from-primary-container to-secondary-container hover:from-primary hover:to-secondary text-white font-label-md text-label-md py-3 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 hover:shadow-[0_0_15px_rgba(124,58,237,0.3)]" type="button">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account?
                <a class="text-secondary hover:text-secondary-fixed font-label-md text-label-md transition-colors ml-1" href="#">Register now</a>
</p>
</div>
</main>
</body></html>
